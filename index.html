<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="./assets/images/joreCode-icon.ico"
    />
    <link rel="stylesheet" href="./style.css" />

    <title>Social links profile </title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <main>
      <div class="img-profile">
        <img src="./assets/images/avatar-DJ-2.webp" alt="" />
      </div>
      <h1 class="name-title">Dheymerson Jore</h1>
      <h3 class="location">Minas Gerais, Brasil</h3>
      <p class="about-profile">"Desenvolvedor Front-End."</p>

      <div class="links-box">
        <a href="https://jorecode.vercel.app/" class="link-item"
          ><i class="fa-solid fa-diagram-project"></i><span>Portfólio</span></a
        >
        <a href="https://github.com/Jore-X" class="link-item"
          ><i class="fa-brands fa-github"></i><span>GitHub</span></a
        >
        <a href="https://www.instagram.com/jorecode" class="link-item"
          ><i class="fa-brands fa-instagram"></i><span>Instagram</span></a
        >
        <a href="https://wa.me/38998439625" class="link-item"
          ><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></a
        >
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Dheymerson Caetano</a>.
    </footer>
  </body>
</html>
